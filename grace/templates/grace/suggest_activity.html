{% extends 'grace/base_grace.html' %}
{% load static %}

{% block grace_content %}
<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">Get Activity Suggestions</h5>
    </div>
    <div class="card-body">
        <form id="suggestionForm" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="activity_type" class="form-label">Activity Type</label>
                <select class="form-select" id="activity_type" name="activity_type" required>
                    <option value="">Select an activity type...</option>
                    <option value="DRAMATIC">Dramatic Play</option>
                    <option value="READING">Reading</option>
                    <option value="MUSIC">Music & Movement</option>
                    <option value="GROUP">Group Activity</option>
                    <option value="SEL">Social Emotional Learning</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="age_group" class="form-label">Age Group</label>
                <select class="form-select" id="age_group" name="age_group" required>
                    <option value="">Select age group...</option>
                    <option value="infant">Infant (0-1 years)</option>
                    <option value="toddler">Toddler (1-3 years)</option>
                    <option value="preschool">Preschool (3-5 years)</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Get Suggestion</button>
        </form>
        
        <div id="suggestionResult" class="mt-4" style="display: none;">
            <h5>Suggested Activity:</h5>
            <div class="card">
                <div class="card-body" id="suggestionText">
                </div>
                <div class="card-footer">
                    <button class="btn btn-success" id="saveActivity">Save Activity</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('suggestionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    fetch('{% url "grace_suggest" %}', {
        method: 'POST',
        body: new FormData(this),
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
        }
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById('suggestionText').textContent = data.suggestion;
        document.getElementById('suggestionResult').style.display = 'block';
    });
});
</script>
{% endblock %}
