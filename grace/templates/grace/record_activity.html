{% extends 'grace/base_grace.html' %}
{% load static %}

{% block grace_content %}
<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">Record New Activity</h5>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Activity Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            
            <div class="mb-3">
                <label for="activity_type" class="form-label">Activity Type</label>
                <select class="form-select" id="activity_type" name="activity_type" required>
                    <option value="">Select activity type...</option>
                    <option value="DRAMATIC">Dramatic Play</option>
                    <option value="READING">Reading</option>
                    <option value="MUSIC">Music & Movement</option>
                    <option value="GROUP">Group Activity</option>
                    <option value="SEL">Social Emotional Learning</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            
            <div class="mb-3">
                <label for="social_skills_focus" class="form-label">Social Skills Focus</label>
                <textarea class="form-control" id="social_skills_focus" name="social_skills_focus" rows="2" required></textarea>
            </div>
            
            <div class="mb-3">
                <label for="picture" class="form-label">Activity Picture</label>
                <input type="file" class="form-control" id="picture" name="picture" accept="image/*">
            </div>
            
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Save Activity</button>
                <a href="{% url 'grace:grace_activities' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
