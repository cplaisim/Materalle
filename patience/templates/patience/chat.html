{% load static %}
<div class="patience-chat d-flex flex-column h-100 p-0">
    <div class="chat-header p-3 rounded-top">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <span class="fw-bold">Patience</span>
            <div class="d-flex flex-wrap gap-2" style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
                <button type="button" class="btn btn-light btn-sm quick-action-btn" id="btn-fine"><i class="fas fa-hand-paper me-1"></i>Fine Motor</button>
                <button type="button" class="btn btn-light btn-sm quick-action-btn" id="btn-gross"><i class="fas fa-running me-1"></i>Gross Motor</button>
                <button type="button" class="btn btn-light btn-sm quick-action-btn" id="btn-hand-eye"><i class="fas fa-hands me-1"></i>Hand-Eye</button>
                <button type="button" class="btn btn-light btn-sm quick-action-btn" id="btn-balance"><i class="fas fa-balance-scale me-1"></i>Balance</button>
                <button type="button" class="btn btn-light btn-sm quick-action-btn" id="btn-sensory"><i class="fas fa-hand-sparkles me-1"></i>Sensory Motor</button>
            </div>
        </div>
    </div>
    <div class="p-3 border-bottom bg-light">
        <form id="patienceChatForm" class="d-flex gap-2">
            {% csrf_token %}
            <input type="hidden" name="conversation_id" id="conversationId" value="">
            <input type="text" name="message" class="form-control form-control-sm" placeholder="Type your message..." required>
            <button type="submit" class="btn btn-primary btn-sm px-3"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
    <div id="llmProgressBar" class="d-none px-3 pt-2">
        <div class="d-flex align-items-center gap-2 mb-1">
            <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
            <small class="text-muted">Thinking with <strong id="llmModelLabel"></strong>...</small>
        </div>
        <div class="progress" style="height: 4px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
        </div>
    </div>
    <div class="chat-messages flex-grow-1 overflow-auto p-3" id="messageContainer">
        <div class="message assistant-message mb-2">
            <div class="d-flex align-items-start">
                <img src="{% static 'images/patience.jpg' %}" alt="Patience" class="rounded-circle me-2" style="width: 40px; height: 40px; object-fit: cover; flex-shrink: 0;">
                <div class="message-content p-2 rounded">Hello! I'm Patience, your motor skills and physical development guide. How can I help with fine motor, gross motor, coordination, or balance activities today?</div>
            </div>
        </div>
    </div>
</div>
{% include 'enroll/schedule_activity_dialog.html' %}

<script>
(function() {
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.getElementById('patienceChatForm');
        var messageContainer = document.getElementById('messageContainer');
        var input = form.querySelector('[name="message"]');
        var conversationIdInput = document.getElementById('conversationId');

        var quickActions = {
            'btn-fine': 'Suggest a Fine Motor activity for young children.',
            'btn-gross': 'Suggest a Gross Motor activity for young children.',
            'btn-hand-eye': 'Suggest a Hand-Eye Coordination activity for young children.',
            'btn-balance': 'Suggest a Balance & Coordination activity for young children.',
            'btn-sensory': 'Suggest a Sensory Motor activity for young children.'
        };
        Object.keys(quickActions).forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.addEventListener('click', function() { input.value = quickActions[id]; });
        });

        function formatResponse(text) {
            var fieldPattern = /\*\*(\w[\w\s&\-]*?):\*\*\s*([\s\S]*?)(?=\n\*\*|\s*$)/g;
            var matches = [];
            var match;
            while ((match = fieldPattern.exec(text)) !== null) {
                matches.push({ label: match[1].trim(), value: match[2].trim() });
            }
            if (matches.length < 2) {
                return '<p>' + text.replace(/\n/g, '<br>') + '</p>';
            }
            var titleText = '';
            var title = '';
            var rows = [];
            matches.forEach(function(m) {
                if (m.label === 'Title') {
                    titleText = m.value;
                    title = '<h6 class="mb-2 fw-bold">' + m.value + '</h6>';
                } else {
                    rows.push(
                        '<tr><td class="fw-semibold text-nowrap align-top pe-3" style="width:140px;color:#666;">' +
                        m.label + '</td><td>' + m.value.replace(/\n/g, '<br>') + '</td></tr>'
                    );
                }
            });

            return title +
                '<table class="table table-sm table-borderless mb-0" style="font-size:0.9rem;">' +
                '<tbody>' + rows.join('') + '</tbody></table>';
        }

        var progressBar = document.getElementById('llmProgressBar');
        var modelLabel = document.getElementById('llmModelLabel');

        function showProgress() {
            fetch('{% url "website:toggle_llm" %}')
                .then(function(r) { return r.json(); })
                .then(function(data) { modelLabel.textContent = data.model || data.backend; })
                .catch(function() { modelLabel.textContent = 'AI'; });
            progressBar.classList.remove('d-none');
        }
        function hideProgress() { progressBar.classList.add('d-none'); }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var message = input.value.trim();
            if (!message) return;

            var userDiv = document.createElement('div');
            userDiv.className = 'message user-message mb-2';
            userDiv.innerHTML = '<div class="message-content p-2 rounded">' + message + '</div>';
            messageContainer.appendChild(userDiv);
            input.value = '';
            messageContainer.scrollTop = messageContainer.scrollHeight;
            showProgress();

            fetch('{% url "patience:send_message" %}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
                body: JSON.stringify({ message: message, conversation_id: conversationIdInput.value || null })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                hideProgress();
                if (data.conversation_id) {
                    conversationIdInput.value = data.conversation_id;
                }
                var formatted = formatResponse(data.message || '');
                var assistantDiv = document.createElement('div');
                assistantDiv.className = 'message assistant-message mb-2';
                assistantDiv.innerHTML = '<div class="d-flex align-items-start"><img src="{% static "images/patience.jpg" %}" alt="Patience" class="rounded-circle me-2" style="width:28px;height:28px;object-fit:cover;"><div class="message-content p-2 rounded">' + formatted + '</div></div>';
                messageContainer.appendChild(assistantDiv);
                messageContainer.scrollTop = messageContainer.scrollHeight;
                if (data.entry_id) {
                    document.dispatchEvent(new CustomEvent('agentEntry', { detail: { entry_id: data.entry_id } }));
                    document.dispatchEvent(new CustomEvent('agentActivityGenerated', {
                        detail: { assistantElement: assistantDiv, entryId: data.entry_id, agent: 'patience', text: data.message || '' }
                    }));
                }
            })
            .catch(function(err) {
                hideProgress();
                console.error(err);
                var errDiv = document.createElement('div');
                errDiv.className = 'message mb-2 small text-danger';
                errDiv.textContent = 'Sorry, there was an error. Please try again.';
                messageContainer.appendChild(errDiv);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            });
        });

    });
})();
</script>
