{% extends "base.html" %}
{% load static %}
{% block content %}
<header>
    <h1>Chat with Patience</h1>
</header>
<div class="container-fluid agent-chat-layout">
    <!-- Row 1: Image + Chat side by side -->
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="card p-0 overflow-hidden h-100">
                <img src="{% static 'images/patience.jpg' %}" alt="Patience" style="width:100%;height:100%;object-fit:cover;min-height:350px;">
                <div class="card-img-overlay d-flex flex-column justify-content-end" style="background:linear-gradient(0deg,rgba(0,0,0,.6) 0%,transparent 50%);">
                    <h5 class="text-white mb-0">Patience</h5>
                    <p class="text-white-50 small mb-0">Motor skills &amp; physical development</p>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="agent-chat-panel h-100">
                {% include 'patience/chat.html' %}
            </div>
        </div>
    </div>
    {% include 'enroll/agent_participants.html' with page='patience' %}
</div>
{% endblock %}
